# Tool configuration only. This repository is a Claude skill, not a Python package.
# Dev dependencies: requirements-dev.txt

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "conftest", "check_copy", "check_links"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples", "tests", "scripts"]
addopts = "-m 'not live' --strict-markers"
# A hung test fails after 60 s instead of burning a CI job (pytest-timeout).
timeout = 60
markers = [
    "live: calls the real API; needs MAGIC_API_KEY (run with: pytest -m live)",
]
